upstream backend_server {
    server backend:8000;
    keepalive 32;
}

# ==============================================================================
# HTTP Server (Port 80)
# Handles Certbot ACME challenge & proxies or redirects to HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot ACME challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to FastAPI Backend (or redirect to HTTPS if SSL is configured)
    location / {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Streaming Timeouts (prevent premature disconnects)
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        
        # Buffering settings for real-time responsiveness
        proxy_buffering off;
    }
}

