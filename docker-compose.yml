version: '3.8'

services:
  backend:
    build:
      context: ./isyaratku_bisindo_backend
      dockerfile: Dockerfile
    image: isyaratku-backend:latest
    container_name: isyaratku_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=false
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    # Resource tuning for 2GB RAM / 2 Cores VPS
    mem_limit: 1500m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - isyaratku_net

  nginx:
    image: nginx:alpine
    container_name: isyaratku_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - isyaratku_net

networks:
  isyaratku_net:
    driver: bridge
